[package]
name = "helm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The library holds the bench-compare logic, not benchmarks. Without this,
# `cargo bench` would hand criterion's flags to the library's libtest harness,
# which rejects them.
bench = false

[[bin]]
name = "bench-compare"
bench = false

[dependencies]
helm-editor = { path = "../helm-editor" }
helm-text = { path = "../helm-text" }
# bench-compare reads budgets.toml and criterion's estimates.json files.
serde_json = "=1.0.154"
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
# Plots off: CI only needs the numbers, and plotters pulls in a large tree.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
[[bench]]
name = "text"
harness = false

[[bench]]
name = "transactions"
harness = false

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "snapshots"
harness = false

[[bench]]
name = "editor"
harness = false

[[bench]]
name = "keymap"
harness = false

[[bench]]
name = "amend"
harness = false

