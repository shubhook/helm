name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older runs. Pushes to main each get
# their own group (keyed by commit SHA), so no main run is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      # rustup reads rust-toolchain.toml, so this installs the pinned
      # version and its components instead of the runner's default Rust.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2.9.2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features --locked
