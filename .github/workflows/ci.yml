name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older runs. Pushes to main each get
# their own group (keyed by commit SHA), so no main run is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      # rustup reads rust-toolchain.toml, so this installs the pinned
      # version and its components instead of the runner's default Rust.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2.9.2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  # Fails a PR when a benchmark gets slower than its budget in
  # crates/helm-bench/budgets.toml (NF-7). Numbers from an earlier run on a
  # different hosted runner are too noisy to compare against, so this job
  # benchmarks the PR's base commit and its head on the same machine.
  bench:
    name: bench
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        # Adds -o pipefail, so `bench-compare | tee` fails when bench-compare does.
        shell: bash
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Criterion flags for every run. 10 s of measurement keeps the 100
      # samples from being cut short on a slow runner.
      BENCH_FLAGS: --warm-up-time 3 --measurement-time 10
      # Base and head runs alternate this many times; each side keeps its
      # fastest median.
      ROUNDS: 3
    steps:
      # The default ref for a pull request is the merge of head into base,
      # which is the code that would land.
      - uses: actions/checkout@v7.0.1

      - name: Check out the base commit
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          echo "CRITERION_HOME=$RUNNER_TEMP/criterion" >> "$GITHUB_ENV"

      - name: Install Rust toolchains
        run: |
          rustup toolchain install
          (cd "$RUNNER_TEMP/base" && rustup toolchain install)

      - uses: Swatinem/rust-cache@v2.9.2

      # Counts helm-bench's bench targets in the workspace of the current
      # directory. A side with none, or with no helm-bench at all, is skipped,
      # and when head has none there is nothing to compare. bench-compare
      # treats an empty head as an error, so it must not run then.
      - name: Build benchmarks
        run: |
          count_benches() {
            cargo metadata --no-deps --format-version 1 --locked |
              jq '[.packages[] | select(.name == "helm-bench") | .targets[]
                   | select(.kind | index("bench"))] | length'
          }
          head_benches=$(count_benches)
          base_benches=$(cd "$RUNNER_TEMP/base" && count_benches)

          if [ "$head_benches" -eq 0 ]; then
            msg="The head commit has no benchmarks, so there is nothing to compare."
            echo "::notice::$msg"
            printf '## Benchmarks\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "HAS_HEAD=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAS_HEAD=true" >> "$GITHUB_ENV"
          cargo bench -p helm-bench --locked --no-run
          cargo build -p helm-bench --bin bench-compare --locked

          if [ "$base_benches" -gt 0 ]; then
            (cd "$RUNNER_TEMP/base" && cargo bench -p helm-bench --locked --no-run)
            echo "HAS_BASE=true" >> "$GITHUB_ENV"
          else
            echo "::notice::The base commit has no benchmarks; every benchmark is new."
            echo "HAS_BASE=false" >> "$GITHUB_ENV"
          fi

      # Alternating base and head spreads any slowdown of the runner over
      # both sides instead of landing on one.
      - name: Run benchmarks
        if: env.HAS_HEAD == 'true'
        run: |
          for round in $(seq "$ROUNDS"); do
            if [ "$HAS_BASE" = true ]; then
              echo "::group::base, round $round"
              (cd "$RUNNER_TEMP/base" && cargo bench -p helm-bench --locked -- $BENCH_FLAGS --save-baseline "base-$round")
              echo "::endgroup::"
            fi
            echo "::group::head, round $round"
            cargo bench -p helm-bench --locked -- $BENCH_FLAGS --save-baseline "head-$round"
            echo "::endgroup::"
          done

      - name: Compare against budgets
        if: env.HAS_HEAD == 'true'
        run: |
          args=()
          for round in $(seq "$ROUNDS"); do
            if [ "$HAS_BASE" = true ]; then
              args+=(--base "base-$round")
            fi
            args+=(--head "head-$round")
          done
          {
            echo "## Benchmarks: base ${BASE_SHA::7} vs head"
            echo
            target/debug/bench-compare --criterion-dir "$CRITERION_HOME" \
              --budgets crates/helm-bench/budgets.toml "${args[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: criterion-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/criterion
          if-no-files-found: ignore

  # Keeps a record of benchmark times on main, one artifact per commit.
  bench-record:
    name: bench-record
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      BENCH_FLAGS: --warm-up-time 3 --measurement-time 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Run benchmarks
        run: |
          export CRITERION_HOME="$RUNNER_TEMP/criterion"
          cargo bench -p helm-bench --locked -- $BENCH_FLAGS --save-baseline main

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: criterion-${{ github.sha }}
          path: ${{ runner.temp }}/criterion
          retention-days: 90
